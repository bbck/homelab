---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: "${APP}-db"
spec:
  # A single instance can't satisfy the primary's PodDisruptionBudget while
  # being evicted, which blocks every node drain (e.g. Talos upgrades)
  enablePDB: false
  instances: 1
  storage:
    size: "${CNPG_STORAGE:-1Gi}"
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: "${APP}"
      owner: "${APP}"
