---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: "${APP}-dragonfly"
spec:
  # The operator default is docker.dragonflydb.io, which serves the same digests
  image: ghcr.io/dragonflydb/dragonfly:v2.0.2
  replicas: 1
  args:
    - --proactor_threads=1
    - --default_lua_flags=allow-undeclared-keys
  authentication:
    passwordFromSecret:
      name: "${APP}-dragonfly"
      key: password
  snapshot:
    cron: "*/5 * * * *"
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      storageClassName: ceph-block
      resources:
        requests:
          storage: "${DRAGONFLY_SNAPSHOT_CAPACITY:-1Gi}"
  resources:
    requests:
      cpu: 10m
      memory: 192Mi
    limits:
      memory: 384Mi
