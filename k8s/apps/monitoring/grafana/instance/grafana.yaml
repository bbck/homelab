---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  # renovate: datasource=docker depName=docker.io/grafana/grafana
  version: 13.2.2
  config:
    log:
      mode: console
    server:
      root_url: https://grafana.bbck.dev
    news:
      news_feed_enabled: "false"
    analytics:
      enabled: "false"
      reporting_enabled: "false"
      check_for_updates: "false"
      check_for_plugin_updates: "false"
    plugins:
      preinstall_auto_update: "false"
    auth.anonymous:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Tailscale
      icon: signin
      auto_login: "true"
      allow_sign_up: "true"
      use_pkce: "true"
      client_id: $__env{TSIDP_CLIENT_ID}
      client_secret: $__env{TSIDP_CLIENT_SECRET}
      scopes: openid email profile
      auth_url: https://idp.taild1477.ts.net/authorize
      token_url: https://idp.taild1477.ts.net/token
      api_url: https://idp.taild1477.ts.net/userinfo
      login_attribute_path: email
      email_attribute_path: email
      name_attribute_path: name
      role_attribute_path: >-
        contains(to_array(not_null(homelab_roles, `[]`)), 'admin')
        && 'GrafanaAdmin'
      role_attribute_strict: "true"
      allow_assign_grafana_admin: "true"
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 1Gi
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 10001
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
          containers:
            - name: grafana
              env:
                - name: TSIDP_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secrets
                      key: TSIDP_CLIENT_ID
                - name: TSIDP_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secrets
                      key: TSIDP_CLIENT_SECRET
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
