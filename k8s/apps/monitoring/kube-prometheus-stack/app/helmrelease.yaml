---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames: ["alertmanager.bbck.dev"]
          parentRefs:
            - name: envoy-internal
              namespace: networking
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        image:
          registry: ghcr.io
        externalUrl: https://alertmanager.bbck.dev
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
      forceDeployDashboards: true
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeProxy:
      enabled: false
    kubeControllerManager: &kubeControllerManager
      service:
        selector:
          k8s-app: kube-controller-manager
    kubeEtcd:
      !!merge <<: *kubeControllerManager # etcd runs on control plane nodes
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      image:
        registry: ghcr.io
      prometheus:
        monitor:
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      rbac:
        extraRules:
          - apiGroups:
              - infra.contrib.fluxcd.io
            resources:
              - terraforms
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: infra.contrib.fluxcd.io
                  version: v1alpha2
                  kind: Terraform
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Terraform resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      reason: [status, conditions, "[type=Ready]", reason]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
    prometheusOperator:
      image:
        registry: ghcr.io
      prometheusConfigReloader:
        image:
          registry: ghcr.io
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.bbck.dev
        image:
          registry: ghcr.io
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        ruleSelector:
          matchExpressions:
            - key: loki
              operator: NotIn
              values:
                - "true"
        retention: 30d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 256Gi
        enableFeatures:
          - memory-snapshot-on-shutdown
        externalLabels:
          cluster: main
      route:
        main:
          enabled: true
          hostnames: ["prometheus.bbck.dev"]
          parentRefs:
            - name: envoy-internal
              namespace: networking
