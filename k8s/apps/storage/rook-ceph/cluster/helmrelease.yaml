---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    operatorNamespace: storage
    monitoring:
      enabled: true
      createPrometheusRules: true
    cephClusterSpec:
      mgr:
        count: 1
      dashboard:
        enabled: false
      crashCollector:
        disable: true
      logCollector:
        enabled: false
      # The CSI keys stay aes (the chart's security.cephx.csi.keyType) because
      # the kernel RBD client needs Linux 7.0+ for aes256k, which keeps these
      # warnings up. Unmute once the CSI keys are rotated to aes256k.
      healthCheck:
        muteHealthWarning:
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      # Requests are well under the chart defaults, which reserve a core per
      # daemon. Memory stays at Rook's recommended minimums (mon 1Gi, mgr 512Mi,
      # osd 2Gi); the OSD cache sizes itself from these, with room to burst.
      resources:
        mgr:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 1Gi
        osd:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            memory: 4Gi
      storage:
        useAllNodes: true
        useAllDevices: false
        # The raw partition Talos creates next to EPHEMERAL, see talos/all/05-storage.yaml.tpl
        devices:
          - name: /dev/disk/by-partlabel/r-osd
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: storage
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: storage
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: storage
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: storage
            csi.storage.k8s.io/controller-modify-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-modify-secret-namespace: storage
            csi.storage.k8s.io/node-publish-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-publish-secret-namespace: storage
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: ceph-block
      isDefault: true
    cephFileSystems: []
    cephObjectStores: []
