---
# Read by the kopiur-repository Kustomization's postBuild.substituteFrom, so it must exist before that build
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2-account
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-r2-account
  data:
    - secretKey: R2_ACCOUNT_ID
      remoteRef:
        key: cloudflare
        property: account_id
