---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        feature.node.kubernetes.io/i915-gpu: "true"
    controllers:
      plex:
        initContainers:
          # Plex only logs to files, so stream the server log to stdout
          logs:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: "1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8"
              pullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                trap 'exit 0' TERM
                tail -n+1 -F "/config/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log" &
                wait
            restartPolicy: Always
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          plex:
            image:
              repository: ghcr.io/home-operations/plex
              tag: "1.43.5.11079@sha256:06ef0fc23e9af9bbaf284c3f27972f94e703d13d6f745edeb6818fcbebf6c673"
              pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              PLEX_PREFERENCE_1: "logDebug=1"
              PLEX_PREFERENCE_2: "LanNetworksBandwidth=192.168.0.0/16,10.244.0.0/16"
              PLEX_PREFERENCE_3: "secureConnections=0"
              PLEX_PREFERENCE_4: "allowedNetworks="
              PLEX_PREFERENCE_5: "allowMediaDeletion=0"
              PLEX_PREFERENCE_6: "TreatWanIpAsLocal=0"
              PLEX_PREFERENCE_7: "GdmEnabled=0"
              PLEX_PREFERENCE_8: "DlnaEnabled=0"
            resources:
              limits:
                gpu.intel.com/i915: 1
                memory: 4096Mi
              requests:
                cpu: 100m
                memory: 2048Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                    scheme: HTTPS
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      plex:
        controller: plex
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.40.130
        externalTrafficPolicy: Local
        ports:
          https:
            port: 32400
    persistence:
      config:
        existingClaim: plex
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server
      cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      media:
        type: nfs
        server: 192.168.40.47
        # Relative to the NFSv4 root, /var/mnt/nas on the NAS
        path: /media
        globalMounts:
          - path: /media
            readOnly: true
