---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        feature.node.kubernetes.io/i915-gpu: "true"
    controllers:
      plex:
        initContainers:
          # Plex only logs to files, so stream the server log to stdout
          logs:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: "1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df"
              pullPolicy: IfNotPresent
            command: ["/bin/sh", "-c"]
            args:
              - |
                trap 'exit 0' TERM
                tail -n+1 -F "/config/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log" &
                wait
            restartPolicy: Always
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          plex:
            image:
              repository: ghcr.io/home-operations/plex
              tag: "1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149"
              pullPolicy: IfNotPresent
            env:
              TZ: America/Los_Angeles
              PLEX_PREFERENCE_1: "logDebug=1"
              PLEX_PREFERENCE_2: "LanNetworksBandwidth=192.168.0.0/16,10.244.0.0/16"
            resources:
              limits:
                gpu.intel.com/i915: 1
                memory: 4096Mi
              requests:
                cpu: 100m
                memory: 2048Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /identity
                    port: 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      plex:
        controller: plex
        type: LoadBalancer
        externalTrafficPolicy: Local
        ports:
          http:
            port: 32400
    route:
      app:
        hostnames: ["plex.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: plex
                port: http
    persistence:
      config:
        existingClaim: plex
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server
      cache:
        existingClaim: plex-cache
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Cache
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/Library/Application Support/Plex Media Server/Logs
      tmp:
        type: emptyDir
      transcode:
        type: emptyDir
      media:
        type: nfs
        server: 192.168.40.47
        # Relative to the NFSv4 root, /var/mnt/nas on the NAS
        path: /media
        globalMounts:
          - path: /media
