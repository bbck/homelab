---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cloudnative-pg
    - ../../../../components/dragonfly
  dependsOn:
    - name: plugin-barman-cloud
      namespace: database
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: immich-db
      namespace: *namespace
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      name: immich-dragonfly
      namespace: *namespace
  interval: 1h
  patches:
    - patch: |-
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: ${APP}-db
        spec:
          imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6-1.1.1@sha256:c7672bc011351a587cc292a94aac7eeebb593ed2e120077bd9c9944c9467db93
          resources:
            limits:
              memory: 2Gi
          postgresql:
            shared_preload_libraries:
              - vchord.so
          bootstrap:
            initdb:
              postInitApplicationSQL:
                - ALTER ROLE "${APP}" WITH SUPERUSER
      target:
        kind: Cluster
  path: ./k8s/apps/default/immich/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      CNPG_STORAGE: 5Gi
