---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich
    template:
      data:
        immich.json: |-
          {
            "backup": {
              "database": {
                "enabled": false
              }
            },
            "ffmpeg": {
              "transcode": "disabled"
            },
            "machineLearning": {
              "enabled": false
            },
            "newVersionCheck": {
              "enabled": false
            },
            "oauth": {
              "enabled": true,
              "issuerUrl": "https://idp.taild1477.ts.net",
              "clientId": "{{ .TSIDP_CLIENT_ID }}",
              "clientSecret": "{{ .TSIDP_CLIENT_SECRET }}",
              "buttonText": "Login with Tailscale",
              "autoLaunch": true,
              "autoRegister": true,
              "roleClaim": "homelab_roles"
            },
            "passwordLogin": {
              "enabled": false
            },
            "server": {
              "externalDomain": "https://immich.bbck.dev"
            }
          }
  dataFrom:
    - extract:
        key: immich
