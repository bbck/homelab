---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mealie
    template:
      data:
        OIDC_CLIENT_ID: "{{ .TSIDP_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .TSIDP_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: mealie
