---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controllers:
      mealie:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
            env:
              BASE_URL: https://mealie.bbck.dev
              API_PORT: &port 9000
              TZ: America/Los_Angeles
              ALLOW_PASSWORD_LOGIN: "false"
              OIDC_AUTH_ENABLED: "true"
              OIDC_CONFIGURATION_URL: https://idp.taild1477.ts.net/.well-known/openid-configuration
              OIDC_PROVIDER_NAME: Tailscale
              OIDC_AUTO_REDIRECT: "true"
              OIDC_REMEMBER_ME: "true"
              OIDC_SCOPES_OVERRIDE: openid email profile
              OIDC_REQUIRES_EMAIL_VERIFICATION: "false"
              OIDC_GROUPS_CLAIM: homelab_roles
              OIDC_ADMIN_GROUP: admin
            envFrom:
              - secretRef:
                  name: mealie
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 256Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/app/about
                    port: *port
              readiness: *probes
              startup:
                enabled: true
                spec:
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        forceRename: mealie
        controller: mealie
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["mealie.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: mealie
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
