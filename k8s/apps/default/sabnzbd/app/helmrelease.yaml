---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Runs on the NAS so downloads go straight to disk instead of over NFS
      nodeSelector:
        kubernetes.io/hostname: cm3588
      # The NAS is tainted for its own workloads, see talos/node/cm3588/03-taint.yaml
      tolerations:
        - key: dedicated
          operator: Equal
          value: nas
          effect: NoSchedule
    controllers:
      sabnzbd:
        replicas: 1
        containers:
          sabnzbd:
            image:
              repository: ghcr.io/home-operations/sabnzbd
              tag: "5.1.3@sha256:b1795982db498ed5691a7b1231f0fac7eed2a1d53e9c81b8e834d02695e76104"
              pullPolicy: IfNotPresent
            env:
              SABNZBD__HOST_WHITELIST_ENTRIES: >-
                sabnzbd, sabnzbd.default, sabnzbd.default.svc, sabnzbd.default.svc.cluster, sabnzbd.default.svc.cluster.local, sabnzbd.bbck.dev
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 10m
                memory: 256Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
    service:
      sabnzbd:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["sabnzbd.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: sabnzbd
                port: http
    persistence:
      config:
        existingClaim: sabnzbd
      data:
        type: hostPath
        # Fails to start rather than writing to the node's own disk if the
        # ZFS dataset isn't mounted
        hostPath: /var/mnt/nas/media/downloads/usenet
        hostPathType: Directory
        globalMounts:
          - path: /data/media/downloads/usenet
