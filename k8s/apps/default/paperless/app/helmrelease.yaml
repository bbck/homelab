---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controllers:
      paperless:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.3.3@sha256:dba0242c1df1843643df4eb50ce5639f3a7900f414879088fd5bed8eaf2d456d
            env:
              PAPERLESS_URL: https://paperless.bbck.dev
              PAPERLESS_PORT: &port 8000
              PAPERLESS_TIME_ZONE: America/Los_Angeles
              PAPERLESS_OCR_LANGUAGE: eng
              PAPERLESS_DBENGINE: postgresql
              PAPERLESS_DBHOST:
                valueFrom:
                  secretKeyRef:
                    name: paperless-db-app
                    key: host
              PAPERLESS_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: paperless-db-app
                    key: dbname
              PAPERLESS_DBUSER:
                valueFrom:
                  secretKeyRef:
                    name: paperless-db-app
                    key: user
              PAPERLESS_DBPASS:
                valueFrom:
                  secretKeyRef:
                    name: paperless-db-app
                    key: password
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: paperless-dragonfly
                    key: password
              PAPERLESS_REDIS:
                value: redis://:$(REDIS_PASSWORD)@paperless-dragonfly:6379
                dependsOn: REDIS_PASSWORD
              S6_READ_ONLY_ROOT: "1"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            envFrom:
              - secretRef:
                  name: paperless
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 10m
                memory: 512Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    service:
      app:
        forceRename: paperless
        controller: paperless
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["paperless.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: paperless
        globalMounts:
          - path: /usr/src/paperless/data
            subPath: data
          - path: /usr/src/paperless/media
            subPath: media
      consume:
        type: emptyDir
        globalMounts:
          - path: /usr/src/paperless/consume
      tmp:
        type: emptyDir
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
