---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controllers:
      karakeep:
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.33.2@sha256:b069e4307dec06ea06d16989c6861c30a1ff208568be44ed5fb5d422cd3e950c
            env:
              MEILI_ADDR: http://karakeep-meilisearch.default.svc.cluster.local:7700
              BROWSER_WEB_URL: http://karakeep-chrome.default.svc.cluster.local:9222
              DATA_DIR: /data
              NEXTAUTH_URL: https://karakeep.bbck.dev
              DISABLE_SIGNUPS: "true"
              DISABLE_NEW_RELEASE_CHECK: "true"
              CRAWLER_PARSER_MEM_LIMIT_MB: "2048"
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local:4000
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-litellm-key
                    key: key
              INFERENCE_TEXT_MODEL: claude-haiku-4-5
              INFERENCE_IMAGE_MODEL: claude-haiku-4-5
              EMBEDDING_TEXT_MODEL: voyage-4-lite
              EMBEDDING_DIMENSIONS: "1024"
              EMBEDDING_CONTEXT_LENGTH: "32000"
              EMBEDDING_ENABLE_AUTO_INDEXING: "true"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
            envFrom:
              - secretRef:
                  name: karakeep
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 10m
                memory: 32Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
      chrome:
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep-chrome
              tag: 154.0.8037.57-r1@sha256:c51a8c8e6c3c1040a50fa0ecfd0b2fc298401b4229262636552458151f6f18fa
              pullPolicy: IfNotPresent
            args:
              - --disable-gpu
              - --disable-dev-shm-usage
              - --hide-scrollbars
              - --disable-blink-features=AutomationControlled
              - --window-size=1440,900
            resources:
              limits:
                memory: 500Mi
              requests:
                cpu: 10m
                memory: 32Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              capabilities:
                drop: ["ALL"]
      meilisearch:
        pod:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - karakeep
                      - key: app.kubernetes.io/controller
                        operator: In
                        values:
                          - karakeep
                  topologyKey: kubernetes.io/hostname
        containers:
          app:
            image:
              repository: getmeili/meilisearch
              tag: v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
            args:
              - /bin/meilisearch
              - --upgrade-db
            env:
              MEILI_NO_ANALYTICS: "true"
            envFrom:
              - secretRef:
                  name: karakeep
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 10m
                memory: 32Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              capabilities:
                drop: ["ALL"]
    service:
      app:
        forceRename: karakeep
        controller: karakeep
        ports:
          http:
            port: 3000
      chrome:
        controller: chrome
        ports:
          http:
            port: 9222
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    route:
      app:
        hostnames: ["karakeep.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: data
          meilisearch:
            app:
              - path: /meili_data
                subPath: meili_data
      cache:
        type: emptyDir
        advancedMounts:
          karakeep:
            app:
              - path: /app/apps/web/.next/cache
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 64Mi
        advancedMounts:
          karakeep:
            app:
              - path: /run
