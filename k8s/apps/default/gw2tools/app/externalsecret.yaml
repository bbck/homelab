---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gw2tools
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gw2tools
    template:
      data:
        GW2_API_KEY: "{{ .GW2_API_KEY }}"
  dataFrom:
    - extract:
        key: gw2tools
