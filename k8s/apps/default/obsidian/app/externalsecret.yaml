---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: obsidian
    creationPolicy: Owner
  data:
    - secretKey: OBSIDIAN_AUTH_TOKEN
      remoteRef:
        key: obsidian
        property: AUTH_TOKEN
    - secretKey: OBSIDIAN_VAULT
      remoteRef:
        key: obsidian
        property: VAULT_NAME
    - secretKey: OBSIDIAN_E2E_PASSWORD
      remoteRef:
        key: obsidian
        property: E2E_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp-api-keys
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  # Envoy accepts every value in this secret as an API key
  target:
    name: obsidian-mcp-api-keys
    creationPolicy: Owner
  data:
    - secretKey: claude
      remoteRef:
        key: obsidian
        property: MCP_API_KEY
