---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian
  namespace: default
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 1m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      obsidian:
        strategy: Recreate
        initContainers:
          # sync-setup is one-time; sync-config re-asserts pull-only on every start
          setup:
            image: &image
              repository: ghcr.io/bbck/obsidian-headless
              tag: 0.0.14@sha256:09de7e1e5435ec16cb3c5082e55a6c448a4a5683eb76744ddc0142964fc50143
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                mkdir -p /data/vault /data/state
                if ! ls "$XDG_CONFIG_HOME"/obsidian-headless/sync/*/config.json >/dev/null 2>&1; then
                  ob sync-setup --json \
                    --vault "$OBSIDIAN_VAULT" \
                    --path /data/vault \
                    --password "$OBSIDIAN_E2E_PASSWORD" \
                    --device-name homelab
                fi
                ob sync-config --json --path /data/vault --mode pull-only
            env: &env
              HOME: /data/state
              XDG_CONFIG_HOME: /data/state
            envFrom:
              - secretRef:
                  name: obsidian
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          sync:
            image: *image
            args: ["sync", "--path", "/data/vault", "--continuous"]
            env:
              <<: *env
              OBSIDIAN_AUTH_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: obsidian
                    key: OBSIDIAN_AUTH_TOKEN
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sync-healthcheck", "900"]
                  periodSeconds: 30
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sync-healthcheck", "900"]
                  periodSeconds: 60
                  failureThreshold: 3
              readiness:
                enabled: false
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
          mcp:
            image:
              repository: ghcr.io/bbck/mcpvault
              tag: 0.16.0@sha256:712d0f4e2e8fac2c35c66faf3f8150a31001c7bc2d1f4dcefa08adf2b2958e3c
            args: ["--host", "0.0.0.0", "--port", "8000", "--", "mcpvault", "/vault", "--read-only"]
            probes:
              liveness: &mcpProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: 8000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *mcpProbe
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: obsidian
        ports:
          http:
            port: 8000
    route:
      app:
        hostnames: ["mcp-obsidian.bbck.dev"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      data:
        existingClaim: obsidian
        advancedMounts:
          obsidian:
            setup:
              - path: /data
            sync:
              - path: /data
            mcp:
              - path: /vault
                subPath: vault
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
