---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/nfd.k8s-sigs.io/nodefeaturerule_v1alpha1.json
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
  name: iot-vlan
spec:
  rules:
    - name: "iot.vlan"
      labels:
        feature.node.kubernetes.io/iot-vlan: "true"
      matchFeatures:
        - feature: network.virtual
          matchExpressions:
            name: { op: In, value: ["enp1s0.20"] }
