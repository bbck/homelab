---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Keeps the hand-made bootstrap secret in sync with 1Password. Connect needs
# this secret to serve anything, so it's created by hand on a new cluster and
# adopted here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: onepassword-secret
    # Not Owner: deleting this ExternalSecret would garbage collect the secret,
    # and with it Connect's credentials, leaving nothing to recreate it from
    creationPolicy: Orphan
    template:
      data:
        # Connect's OP_SESSION takes the credentials file base64-encoded
        1password-credentials.json: "{{ .credentials | b64enc }}"
        token: "{{ .token }}"
  data:
    - secretKey: credentials
      remoteRef:
        key: onepassword-connect
        property: file/1password-credentials.json
    - secretKey: token
      remoteRef:
        key: onepassword-connect
        property: external_secrets_token
