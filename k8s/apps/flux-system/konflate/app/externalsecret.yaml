---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: konflate
    template:
      data:
        KONFLATE_APP_CLIENT_ID: "{{ .app_id }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .private_key }}"
        KONFLATE_WEBHOOK_SECRET: "{{ .konflate_webhook_token }}"
  data:
    - secretKey: konflate_webhook_token
      remoteRef:
        key: github
        property: konflate_webhook_token
  dataFrom:
    - extract:
        key: github-bot
