---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: cloudflare
  namespace: flux-system
spec:
  approvePlan: auto
  backendConfig:
    customConfiguration: |
      backend "s3" {
        bucket = "terraform"
        key    = "cloudflare/cloudflare.tfstate"
        region = "auto"

        skip_credentials_validation = true
        skip_requesting_account_id  = true
        skip_metadata_api_check     = true
        skip_region_validation      = true
        use_path_style              = true
        use_lockfile                = true
      }
  backendConfigsFrom:
    - kind: Secret
      name: terraform-r2-backend-secret
  interval: 1h
  path: ./terraform/cloudflare
  planOnly: true
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: terraform-r2-secret
  sourceRef:
    kind: GitRepository
    name: homelab
    namespace: flux-system
  varsFrom:
    - kind: Secret
      name: terraform-secret
