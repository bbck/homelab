---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraform-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: terraform-secret
    creationPolicy: Owner
  data:
    - secretKey: op_connect_token
      remoteRef:
        key: onepassword-connect
        property: terraform_token
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraform-r2-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: terraform-r2-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ENDPOINT_URL_S3
      remoteRef:
        key: terraform-r2
        property: endpoint
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: terraform-r2-backend-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: terraform-r2-backend-secret
    creationPolicy: Owner
  data:
    - secretKey: access_key
      remoteRef:
        key: terraform-r2
        property: AWS_ACCESS_KEY_ID
    - secretKey: secret_key
      remoteRef:
        key: terraform-r2
        property: AWS_SECRET_ACCESS_KEY
