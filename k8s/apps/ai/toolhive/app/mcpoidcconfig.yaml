---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpoidcconfig_v1beta1.json
# Validates the tokens issued by the gateway's own embedded auth server
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: mcp-gateway
spec:
  type: inline
  inline:
    issuer: https://mcp.bbck.dev
    jwksAllowPrivateIP: true
