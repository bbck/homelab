---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  image: ghcr.io/berriai/litellm:v1.106.4@sha256:c169fb3adc514fcf210377c203f3de406d54f10bfdacf13948a4a839db9af7de
  automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-db-app
          key: uri
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: LITELLM_MASTER_KEY
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: litellm-dragonfly
          key: password
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: PROXY_BASE_URL
      value: https://litellm.bbck.dev
    - name: GENERIC_CLIENT_ID
      value: 13e748b88b28fb33b21935d0d5fe3ede
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: TSIDP_CLIENT_SECRET
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://idp.taild1477.ts.net/authorize
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://idp.taild1477.ts.net/token
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://idp.taild1477.ts.net/userinfo
    - name: GENERIC_SCOPE
      value: openid email profile
    - name: GENERIC_USER_ID_ATTRIBUTE
      value: sub
    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: name
    - name: CHECKPOINT_DISABLE
      value: "1"
  apiAccess:
    masterKeyRef:
      name: litellm-secrets
      key: LITELLM_MASTER_KEY
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 90
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  generalSettings:
    store_prompts_in_spend_logs: true
    disable_env_credential_login: true
  litellmSettings:
    default_internal_user_params:
      user_role: proxy_admin
  routerSettings:
    redis_host: litellm-dragonfly
    redis_port: 6379
    redis_password: os.environ/REDIS_PASSWORD
    retry_policy:
      RateLimitErrorRetries: 5
    allowed_fails: 10
    cooldown_time: 15
  route:
    hostnames:
      - litellm.bbck.dev
    parentRefs:
      - name: envoy-internal
        namespace: networking
