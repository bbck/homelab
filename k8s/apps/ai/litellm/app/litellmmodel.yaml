---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: voyage-4-lite
spec:
  modelName: voyage-4-lite
  params:
    model: voyage/voyage-4-lite
    apiKeyRef:
      name: litellm-secrets
      key: VOYAGE_API_KEY
    rpm: 3
    tpm: 10000
    additional:
      # Voyage rejects encoding_format=float, which karakeep >= 0.34 always sends
      additional_drop_params: ["encoding_format"]
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: grok-4-7
spec:
