---
# yaml-language-server: $schema=https://json.schemastore.org/pull-request-labeler.json
area/docs:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"
area/github:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
area/hack:
  - changed-files:
      - any-glob-to-any-file: "hack/**"
area/kubernetes:
  - changed-files:
      - any-glob-to-any-file: "k8s/**"
area/mise:
  - changed-files:
      - any-glob-to-any-file: "mise.toml"
area/talos:
  - changed-files:
      - any-glob-to-any-file: "talos/**"
area/terraform:
  - changed-files:
      - any-glob-to-any-file: "terraform/**"
