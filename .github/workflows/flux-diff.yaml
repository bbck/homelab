---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"
on:
  pull_request:
    branches:
      - master
    paths:
      - "k8s/**"
jobs:
  diffs:
    name: Compute diffs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FLATE_CACHE_DIR: ${{ runner.temp }}/flate-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup mise
        uses: jdx/mise-action@v4.3.0
      - name: Restore flate cache
        uses: actions/cache@v6
        with:
          path: ${{ env.FLATE_CACHE_DIR }}
          key: flate-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            flate-${{ runner.os }}-${{ runner.arch }}-
      - name: Compute diff
        id: diff
        env:
          FLATE_BASE: ${{ github.event.pull_request.base.sha }}
          FLATE_OUTPUT: github
        run: |
          mise run --quiet flux-diff > "${RUNNER_TEMP}/diff.txt"
          # A PR comment caps out at 65536 characters, so leave room for the
          # fences and the truncation notice.
          if [[ $(wc -c < "${RUNNER_TEMP}/diff.txt") -gt 60000 ]]; then
            head -c 60000 "${RUNNER_TEMP}/diff.txt" > "${RUNNER_TEMP}/diff.trunc"
            printf '\n... diff truncated, run `mise run flux-diff` locally for the rest\n' >> "${RUNNER_TEMP}/diff.trunc"
            mv "${RUNNER_TEMP}/diff.trunc" "${RUNNER_TEMP}/diff.txt"
          fi
          {
            echo 'diff<<FLUX_DIFF_EOF'
            cat "${RUNNER_TEMP}/diff.txt"
            echo 'FLUX_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: PR Comments
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.diff != '' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post diff
          message: |
            `````diff
            ${{ steps.diff.outputs.diff }}
            `````
