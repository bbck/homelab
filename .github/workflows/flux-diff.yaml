---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Flux Diff"
on:
  pull_request:
    branches:
      - master
    paths:
      - "k8s/**"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  diffs:
    name: Compute diffs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: ${{ github.event.pull_request.base.sha }}
          cache: true
      - name: Compute diff
        id: diff
        run: |
          flate diff all --path k8s --no-progress -o github > "${RUNNER_TEMP}/diff.txt"
          # A PR comment caps out at 65536 characters, so leave room for the
          # fences and the truncation notice.
          if [[ $(wc -c < "${RUNNER_TEMP}/diff.txt") -gt 60000 ]]; then
            head -c 60000 "${RUNNER_TEMP}/diff.txt" > "${RUNNER_TEMP}/diff.trunc"
            printf '\n... diff truncated, run `mise run flux-diff` locally for the rest\n' >> "${RUNNER_TEMP}/diff.trunc"
            mv "${RUNNER_TEMP}/diff.trunc" "${RUNNER_TEMP}/diff.txt"
          fi
          {
            echo 'diff<<FLUX_DIFF_EOF'
            cat "${RUNNER_TEMP}/diff.txt"
            echo 'FLUX_DIFF_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: PR Comments
        uses: mshick/add-pr-comment@v3
        if: ${{ steps.diff.outputs.diff != '' }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          message-failure: Unable to post diff
          message: |
            `````diff
            ${{ steps.diff.outputs.diff }}
            `````
