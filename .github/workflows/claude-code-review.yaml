---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Claude Code Review"
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Claude code review
    # Only review personal PRs
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      !github.event.pull_request.draft
    runs-on: [actions-runner]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # must be job-level: a step env: never reaches a composite action's CLI
      ANTHROPIC_BASE_URL: http://litellm.ai.svc.cluster.local:4000
      # the review skill's subagents use the haiku alias; litellm must serve it
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
    steps:
      # step-scoped Connect creds, so the review step's shell never sees them
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          LITELLM_KEY: op://Homelab/litellm/GITHUB_ACTIONS_KEY
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the review reads git history and blame, so it needs the full clone
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          # required by the action; the bearer token below is what litellm reads
          anthropic_api_key: ${{ steps.op.outputs.LITELLM_KEY }}
          # the classifier calls api.anthropic.com directly, so it only 401s here
          classify_inline_comments: "false"
          settings: |
            {
              "env": {
                "ANTHROPIC_AUTH_TOKEN": "${{ steps.op.outputs.LITELLM_KEY }}"
              }
            }
          prompt: "/code-review medium ${{ github.event.pull_request.number }} --comment"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Glob,Grep,Agent,Task,Skill,TodoWrite,Bash(git:*),Bash(gh:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"
