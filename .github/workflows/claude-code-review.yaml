---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Claude Code Review"
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Claude code review
    # Only review personal PRs
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      !github.event.pull_request.draft
    runs-on: [actions-runner]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # step-scoped Connect creds, so the review step's shell never sees them
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: op://Homelab/claude-code/CLAUDE_CODE_OAUTH_TOKEN
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # the review reads git history and blame, so it needs the full clone
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: Install tools
        uses: jdx/mise-action@v5
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.11.5
          cache: false
      - name: Set flate base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: echo "FLATE_BASE=$(git merge-base "$BASE_SHA" HEAD)" >> "$GITHUB_ENV"
      - name: Review
        uses: anthropics/claude-code-action@v1
        env:
          FLATE_NO_PROGRESS: "true"
          GOMEMLIMIT: 512MiB
        with:
          claude_code_oauth_token: ${{ steps.op.outputs.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Follow the PR Reviews section in AGENTS.md for this repository's conventions.

            Check changes with the mise tasks in the Commands section of AGENTS.md. `mise run flux-diff` diffs against where this branch forked from master.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools
              "Read"
              "Glob"
              "Grep"
              "Bash(cd:*)"
              "Bash(git blame:*)"
              "Bash(git diff:*)"
              "Bash(git log:*)"
              "Bash(git show:*)"
              "Bash(gh pr comment:*)"
              "Bash(gh pr diff:*)"
              "Bash(gh pr view:*)"
              "Bash(mise run flux-build:*)"
              "Bash(mise run flux-diff:*)"
              "Bash(mise run flux-test:*)"
              "Bash(mise run tofu-check:*)"
              "Bash(flate get:*)"
              "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools
              "Edit"
              "Write"
              "NotebookEdit"
              "WebFetch"
              "WebSearch"
