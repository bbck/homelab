#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2025.1.0"

[tools]
helm = "4.3.1"
opentofu = "1.13.1"
talosctl = "1.14.4"
yq = "4.54.1"
"github:home-operations/flate" = "0.6.5"
"github:home-operations/kopiur" = "0.10.15"
"github:postfinance/topf" = "0.6.1"
"github:turing-machines/tpi" = "1.0.7"

[env]
_.path = ["{{ config_root }}/talos/bin"]
FLATE_PATH = "{{ config_root }}/k8s"
TOPFCONFIG = "{{ config_root }}/talos/topf.yaml"
# The image factory only serves installers for schematics it has been sent, so
# register them rather than only computing their IDs locally
TOPF_SUBMIT_TO_FACTORY = "true"

[tasks.talosconfig]
description = "Write talos/talosconfig from the cluster's secrets bundle"
sources = ["talos/topf.yaml"]
outputs = ["talos/talosconfig"]
# Through a private temp file, so a failed secrets lookup can't leave an empty
# talosconfig behind
run = 'tmp=$(mktemp) && topf talosconfig > "$tmp" && mv "$tmp" talos/talosconfig'

[tasks.kubeconfig]
description = "Merge the cluster's admin kubeconfig into ~/.kube/config as admin@homelab"
depends = ["talosconfig"]
run = 'talosctl --talosconfig talos/talosconfig --nodes "$(yq .data.vip "$TOPFCONFIG")" kubeconfig --force'

[tasks.flux-diff]
description = "Diff rendered Flux manifests against a baseline git rev (default: master)"
run = 'flate diff all --base "${FLATE_BASE:-master}" --no-progress'

[tasks.flux-build]
description = "Render a named Flux Kustomization to YAML"
run = "flate build ks --no-progress"

[tasks.flux-test]
description = "Validate that every Flux Kustomization and HelmRelease renders"
run = "flate test all --no-progress"

[tasks.tofu]
description = "Run tofu in the current directory with the R2 credentials and state passphrase from 1Password"
dir = "{{ cwd }}"
run = "op run -- tofu"

[tasks.tofu.env]
AWS_ACCESS_KEY_ID = "op://Homelab/terraform-r2/AWS_ACCESS_KEY_ID"
AWS_SECRET_ACCESS_KEY = "op://Homelab/terraform-r2/AWS_SECRET_ACCESS_KEY"
AWS_ENDPOINT_URL_S3 = "op://Homelab/terraform-r2/endpoint"
TF_VAR_state_passphrase = "op://Homelab/terraform-r2/TF_STATE_PASSPHRASE"
