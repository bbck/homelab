---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.14.2/website/content/v1.14/schemas/config.schema.json
# Interface name isn't known until Talos is booted; alias the onboard RTL8125B.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: lan0
selector:
  match: link.driver == "r8169"
