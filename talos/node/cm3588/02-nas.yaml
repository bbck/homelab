---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/v1.14.5/website/content/v1.14/schemas/config.schema.json
# The zfs extension imports all pools at boot. Datasets must be mounted under
# /var/mnt to be visible to the kubelet and usable as hostPath volumes.
apiVersion: v1alpha1
kind: KernelModuleConfig
name: zfs
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nfsd
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  module.zfs.parameters.zfs_arc_max: "17179869184" # 16Gi
  # Spread NIC packet processing over cpu4,5,7 (the A76s minus the IRQ core)
  class.net.enP4p65s0.queues.rx-0.rps_cpus: "b0"
